[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nusantaracare-rag"
version = "1.0.0"
description = "Document-grounded NusantaraCare internal assistant API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "scikit-learn>=1.5,<2",
    "openai>=2.0,<3",
    "python-dotenv>=1.0,<2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*"]
